<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        var params = new URLSearchParams(location.search);
        var saved = params.get("theme") || localStorage.getItem("theme") || "light";
        if (saved === "dark") document.documentElement.setAttribute("data-theme", "dark");
        localStorage.setItem("theme", saved);
      })();
    </script>
    <link rel="stylesheet" href="./pages/home.css" />
    <link
      rel="shortcut icon"
      href="./images/x-icon/__x-icon.png"
      type="image/png"
    />
    <title>Dev Tools</title>
  </head>
  <body>
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
      <span class="theme-toggle__icon theme-toggle__icon--sun" aria-hidden="true">☀️</span>
      <span class="theme-toggle__icon theme-toggle__icon--moon" aria-hidden="true">🌙</span>
    </button>

    <header class="home-header">
      <div class="home-header__inner">
        <p class="home-eyebrow">Toolkit</p>
        <h1 class="home-title">Dev Tools</h1>
        <p class="home-subtitle">A collection of simple tools for developers</p>
      </div>
    </header>

    <main class="sections">
      <p class="sections__label">Tools</p>

      <div class="home-grid">
        
      </div>

      <p class="sections__label" style="margin-top: 32px;">More</p>
      <div class="more-grid">
        
      </div>
    </main>

    <footer class="footer">
      <p class="footer__caption">
        Dev Tools is a free set of small utilities for everyday front-end work —
        no sign-up, nothing to install. Developed by
        <a
          class="footer__caption-highlight"
          href="https://github.com/Mea6ea6"
          target="_blank"
          rel="noopener noreferrer"
          >@Mea6ea6</a
        >
      </p>
    </footer>
    <script src="./scripts/transitions.js" defer></script>
    <script src="./scripts/theme.js" defer></script>
    <script src="./pages/tools-data.js" defer></script>
    <script src="./pages/home.js" defer></script>
  </body>
</html>
